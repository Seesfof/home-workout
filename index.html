<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10151c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Мои тренировки"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>Мои тренировки</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f3f6fa;background:#10151c}*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow-x:hidden}html{overflow-x:hidden}button,input,select{max-width:100%}button,input,select{font:inherit}button{cursor:pointer}main{max-width:650px;margin:auto;padding:calc(env(safe-area-inset-top) + 26px) 18px calc(env(safe-area-inset-bottom) + 105px)}h1{font-size:30px;letter-spacing:-.8px;margin:8px 0 8px}h2{font-size:20px;margin:22px 0 14px}.muted{color:#9ba9b8}.eyebrow{color:#9ba9b8;font-size:12px;text-transform:uppercase;letter-spacing:1.5px}.card{background:#1b2430;border:1px solid #2d3948;border-radius:20px;padding:17px;margin:12px 0}.hero{background:linear-gradient(130deg,#264f48,#1b3542);border-color:#356c63}.hero h2{margin:8px 0}.pill{display:inline-block;background:#2b3d49;color:#c9e4db;border-radius:99px;padding:5px 9px;font-size:12px}.btn{background:#9df1c6;color:#10241b;border:0;border-radius:13px;padding:13px 16px;font-weight:750;min-height:46px}.btn.secondary{background:#303d4b;color:#f4f7fb}.btn.danger{background:#51313b;color:#ffd7dc}.btn:disabled{opacity:.5}.wide{width:100%}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0;flex-wrap:wrap}.row>*{min-width:0;overflow-wrap:anywhere}.card{min-width:0;overflow-wrap:anywhere}.rest-buttons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}.rest-buttons .btn{padding:12px 5px}.tabs{overflow-x:auto}.tabs button{min-width:0;flex:1;font-size:clamp(11px,3vw,14px);white-space:nowrap}.set{grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) 42px}@media(max-width:350px){main{padding-left:10px;padding-right:10px}.card{padding:12px}.tabs{gap:1px;padding-left:4px;padding-right:4px}.tabs button{padding:10px 2px}}.stack{display:grid;gap:9px}.exercise{border-top:1px solid #35404c;padding:14px 0}.exercise:first-child{border-top:0}.exercise strong{display:block}.set{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) 44px;gap:7px;align-items:center;margin:8px 0}.set input{width:100%;min-width:0;background:#111923;border:1px solid #41505e;border-radius:10px;padding:11px 7px;color:white;text-align:center}.set button{border:0;border-radius:10px;background:#334452;color:white;height:42px}.set button.done{background:#9df1c6;color:#10241b}.tabs{position:fixed;bottom:0;left:0;right:0;background:#18212bea;border-top:1px solid #34404c;padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);display:flex;justify-content:center;gap:8px;backdrop-filter:blur(14px);z-index:4}.tabs button{border:0;background:transparent;color:#a9b7c4;border-radius:12px;padding:10px 8px;min-width:75px}.tabs button.active{background:#30483f;color:#b8ffdb}input[type=file]{max-width:100%}.small{font-size:13px}.stat{font-size:26px;font-weight:800}.empty{padding:20px;text-align:center;color:#9ba9b8}.hidden{display:none}button:focus-visible,input:focus-visible{outline:2px solid #9df1c6;outline-offset:2px}
</style></head><body><main id="app"></main><nav class="tabs" id="tabs" aria-label="Разделы"></nav><script>
const PROGRAMS=[{id:'a',name:'Тренировка A',focus:'Спина · грудь · ноги',items:[['Подтягивания','Турник',3,'5–10',false],['Отжимания на брусьях','Брусья',3,'6–12',false],['Приседания с гантелями','Гантели',3,'10–15',true],['Сгибания рук с гантелями','Гантели',2,'10–12',true]]},{id:'b',name:'Тренировка B',focus:'Плечи · спина · ноги',items:[['Жим гантелей вверх','Гантели',3,'8–12',true],['Тяга гантели в наклоне','Гантели',3,'8–12',true],['Выпады с гантелями','Гантели',3,'8–12 на ногу',true],['Отжимания от пола','Пол',3,'8–15',false]]},{id:'c',name:'Тренировка C',focus:'Всё тело',items:[['Подтягивания','Турник',3,'5–10',false],['Отжимания на брусьях','Брусья',3,'6–12',false],['Румынская тяга с гантелями','Гантели',3,'10–12',true],['Разведения гантелей в стороны','Гантели',2,'12–15',true]]}];
const KEY='home-workout-iphone-v1',REST_KEY='home-workout-rest-v2';
function validSet(s){return s&&typeof s==='object'&&typeof s.done==='boolean'&&['string','number'].includes(typeof s.count)&&['string','number'].includes(typeof s.kg)&&String(s.count).length<=10&&String(s.kg).length<=10}
function validWorkout(w){return w&&typeof w==='object'&&['a','b','c'].includes(w.id)&&typeof w.date==='string'&&!Number.isNaN(Date.parse(w.date))&&Array.isArray(w.items)&&w.items.length>0&&w.items.length<=30&&w.items.every(e=>e&&typeof e.name==='string'&&e.name.length<=120&&typeof e.weighted==='boolean'&&Array.isArray(e.sets)&&e.sets.length>0&&e.sets.length<=20&&e.sets.every(s=>validSet(s)&&(!s.done||validCompletedSet(s,e.weighted))))}
function validState(d){return d&&typeof d==='object'&&Array.isArray(d.history)&&d.history.length<=10000&&d.history.every(validWorkout)&&(d.active==null||validWorkout(d.active))}
let state={history:[],active:null};try{const stored=JSON.parse(localStorage.getItem(KEY));if(validState(stored))state=stored}catch{}
let tab='home',restEnd=0,ticker=null;try{restEnd=Math.max(0,Number(localStorage.getItem(REST_KEY))||0)}catch{};
const app=document.getElementById('app');function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch{alert('Не удалось сохранить данные. Проверь свободное место и сделай резервную копию.');return false}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function nav(){document.getElementById('tabs').innerHTML=[['home','Главная'],['train','Тренировка'],['history','История'],['progress','Прогресс']].map(([id,label])=>`<button class="${tab===id?'active':''}" data-tab="${id}">${label}</button>`).join('')}function program(id){return PROGRAMS.find(p=>p.id===id)}function start(id){if(state.active&&!confirm('Заменить незавершённую тренировку?'))return;const p=program(id);state.active={id,date:new Date().toISOString(),items:p.items.map(([name,equipment,n,reps,weighted])=>({name,equipment,reps,weighted,sets:Array.from({length:n},()=>({count:'',kg:'',done:false}))}))};save();tab='train';render()}function render(){nav();if(tab==='home'){app.innerHTML=`<div class="eyebrow">Твой домашний зал</div><h1>Мои тренировки</h1><p class="muted">Турник, брусья, гантели и собственный вес. Без лишнего.</p><div class="card hero"><span class="pill">${state.active?'Не завершена':'Готов к тренировке'}</span><h2>${state.active?esc(program(state.active.id)?.name||'Тренировка'):'Начни тренировку'}</h2><p class="muted">${state.active?'Продолжи с того места, где остановился.':'Выбери программу и записывай результаты каждого подхода.'}</p>${state.active?'<button class="btn wide" data-tab="train">Продолжить</button>':''}</div><h2>Готовые программы</h2>${PROGRAMS.map(p=>`<div class="card"><div class="row"><div><strong>${p.name}</strong><div class="muted small">${p.focus} · ${p.items.length} упражнения</div></div><button class="btn" data-start="${p.id}">Начать</button></div></div>`).join('')}<p class="muted small">Ориентир: 3 тренировки в неделю с днями отдыха. Подбирай нагрузку по своим возможностям, не работай через боль.</p>`}else if(tab==='train'){if(!state.active){app.innerHTML='<h1>Тренировка</h1><div class="empty">Нет активной тренировки. Выбери программу на главной.</div><button class="btn wide" data-tab="home">Выбрать программу</button>'}else{const a=state.active;app.innerHTML=`<div class="eyebrow">Тренировка в процессе</div><h1>${esc(program(a.id)?.name||'Тренировка')}</h1><p class="muted small">Вес гантелей вводи фактический, включая гриф. Для упражнений с собственным весом поле кг не требуется.</p><div class="card"><div class="row"><strong>Отдых между подходами</strong><strong id="clock">—</strong></div><div class="rest-buttons"><button class="btn secondary" data-rest="60">60 сек</button><button class="btn secondary" data-rest="90">90 сек</button><button class="btn secondary" data-rest="120">120 сек</button></div></div>${a.items.map((e,i)=>`<div class="card"><strong>${esc(e.name)}</strong><div class="muted small">${esc(e.equipment)} · ориентир ${esc(e.reps)} повторений</div><div class="row muted small" style="margin-top:12px"><span>Подход</span><span>Повторы / ${e.weighted?'кг на гантель':'вес тела'}</span></div>${e.sets.map((s,j)=>`<div class="set"><span>${j+1}</span><input aria-label="Повторы, ${esc(e.name)}, подход ${j+1}" type="number" min="0" max="999" inputmode="numeric" placeholder="Повт." value="${esc(s.count)}" data-field="count" data-i="${i}" data-j="${j}"><input aria-label="Вес, ${esc(e.name)}, подход ${j+1}" type="number" min="0" max="999" step="0.5" inputmode="decimal" placeholder="${e.weighted?'кг':'—'}" ${e.weighted?'':'disabled'} value="${esc(s.kg)}" data-field="kg" data-i="${i}" data-j="${j}"><button aria-label="Отметить подход" class="${s.done?'done':''}" data-done="${i}:${j}">${s.done?'✓':'○'}</button></div>`).join('')}</div>`).join('')}<button class="btn wide" data-finish="1">Завершить и сохранить</button><button class="btn danger wide" style="margin-top:12px" data-cancel="1">Отменить тренировку</button>`;updateClock()}}else if(tab==='history'){app.innerHTML=`<h1>История</h1><p class="muted">Все сохранённые тренировки.</p>${state.history.length?state.history.slice().reverse().map((h,reverseIndex)=>`<div class="card"><strong>${esc(h.name)}</strong><div class="muted small">${new Date(h.date).toLocaleDateString('ru-RU')} · ${h.items.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0)} подходов</div><button class="btn danger" style="margin-top:10px" data-delete-index="${state.history.length-1-reverseIndex}">Удалить запись</button>${h.items.map(e=>`<div class="small" style="margin-top:8px">${esc(e.name)}: ${e.sets.filter(s=>s.done).map(s=>`${esc(s.count)}${e.weighted&&s.kg!==''?' × '+esc(s.kg)+' кг':''}`).join(', ')||'нет выполненных'}</div>`).join('')}</div>`).join(''):'<div class="empty">Здесь появятся завершённые тренировки.</div>'}<h2>Резервная копия</h2><div class="card stack"><button class="btn secondary" data-export="1">Скачать данные (JSON)</button><label class="small">Восстановить данные из файла<input id="import" type="file" accept="application/json,.json"></label></div>`}else{const completed=state.history.length;const sets=state.history.reduce((n,h)=>n+h.items.reduce((m,e)=>m+e.sets.filter(s=>s.done).length,0),0);let best={};state.history.forEach(h=>h.items.forEach(e=>e.sets.filter(s=>s.done).forEach(s=>{const n=Number(s.count);if(Number.isFinite(n)&&n>0){const v=best[e.name]||{reps:0,kg:0};v.reps=Math.max(v.reps,n);if(e.weighted&&Number.isFinite(Number(s.kg)))v.kg=Math.max(v.kg,Number(s.kg)||0);best[e.name]=v}})));app.innerHTML=`<h1>Прогресс</h1><p class="muted">Твои результаты без отслеживания веса тела.</p><div class="row"><div class="card" style="flex:1"><div class="stat">${completed}</div><div class="muted small">Тренировок</div></div><div class="card" style="flex:1"><div class="stat">${sets}</div><div class="muted small">Подходов</div></div></div><h2>Личные результаты</h2>${Object.keys(best).length?Object.entries(best).map(([name,v])=>`<div class="card row"><strong>${esc(name)}</strong><span class="small">${v.reps} повт.${v.kg?' · '+v.kg+' кг':''}</span></div>`).join(''):'<div class="empty">Результаты появятся после первой тренировки.</div>'}`}}
function validCompletedSet(s,weighted){const c=Number(s.count),kg=Number(s.kg);return String(s.count).trim()!==''&&Number.isInteger(c)&&c>=1&&c<=999&&(!weighted||(String(s.kg).trim()!==''&&Number.isFinite(kg)&&kg>=0&&kg<=999))}
function updateClock(){const el=document.getElementById('clock');if(el)el.textContent=restEnd?Math.max(0,Math.ceil((restEnd-Date.now())/1000))+' сек':'—';if(restEnd&&Date.now()>=restEnd){restEnd=0;try{localStorage.removeItem(REST_KEY)}catch{};if(navigator.vibrate)navigator.vibrate(200)}}document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render()}else if(b.dataset.start)start(b.dataset.start);else if(b.dataset.rest){restEnd=Date.now()+Number(b.dataset.rest)*1000;try{localStorage.setItem(REST_KEY,String(restEnd))}catch{};updateClock()}else if(b.dataset.done){const[i,j]=b.dataset.done.split(':').map(Number);const s=state.active.items[i].sets[j];if(!s.done&&!validCompletedSet(s,state.active.items[i].weighted)){alert('Укажи целое число повторений от 1 до 999 и корректный вес гантели от 0 до 999 кг');return}s.done=!s.done;save();render()}else if(b.dataset.finish){const a=state.active;const count=a.items.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0);if(!count){alert('Отметь хотя бы один выполненный подход');return}if(!a.items.every(e=>e.sets.every(s=>!s.done||validCompletedSet(s,e.weighted)))){alert('Проверь данные выполненных подходов');return}const total=a.items.reduce((n,e)=>n+e.sets.length,0);if(count<total&&!confirm(`Выполнено ${count} из ${total} подходов. Завершить тренировку?`))return;state.history.push({...a,uid:'w'+Date.now()+'-'+Math.random().toString(36).slice(2),name:program(a.id).name,finished:new Date().toISOString()});state.active=null;save();tab='history';render()}else if(b.dataset.cancel){if(confirm('Удалить незавершённую тренировку?')){state.active=null;save();render()}}else if(b.hasAttribute('data-delete-index')){if(confirm('Удалить эту тренировку из истории?')){const idx=Number(b.dataset.deleteIndex);if(Number.isInteger(idx)&&idx>=0&&idx<state.history.length){state.history.splice(idx,1);save();render()}}}else if(b.dataset.export){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='home-workout-backup.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}});document.addEventListener('change',async e=>{const t=e.target;if(t.dataset.field&&state.active){const s=state.active.items[Number(t.dataset.i)].sets[Number(t.dataset.j)];s[t.dataset.field]=t.value;if(s.done&&!validCompletedSet(s,state.active.items[Number(t.dataset.i)].weighted))s.done=false;save()}if(t.id==='import'&&t.files[0]){try{if(t.files[0].size>10000000)throw Error('Файл слишком большой');const d=JSON.parse(await t.files[0].text());if(!validState(d))throw Error('Неверный формат');if(confirm('Заменить текущие данные данными из резервной копии?')){state={history:d.history,active:d.active||null};save();render()}}catch{alert('Не удалось прочитать резервную копию')}}});document.addEventListener('input',e=>{const t=e.target;if(t.dataset.field&&state.active){const ex=state.active.items[Number(t.dataset.i)],set=ex.sets[Number(t.dataset.j)];set[t.dataset.field]=t.value;if(set.done&&!validCompletedSet(set,ex.weighted)){set.done=false;const btn=document.querySelector('[data-done="'+t.dataset.i+':'+t.dataset.j+'"]');if(btn){btn.classList.remove('done');btn.textContent='○'}}save()}});ticker=setInterval(updateClock,300);render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
